name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC
    - cron: '0 8 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-normattiva:
    name: Ping Normattiva
    runs-on: ubuntu-latest
    steps:
      - name: Ping Normattiva Supabase
        run: |
          set +e

          URL="${{ secrets.NORMATTIVA_SUPABASE_URL }}"
          KEY="${{ secrets.NORMATTIVA_SUPABASE_ANON_KEY }}"

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::NORMATTIVA_SUPABASE_URL or NORMATTIVA_SUPABASE_ANON_KEY is missing or empty."
            exit 0
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${URL}/rest/v1/" \
            -H "apikey: ${KEY}")
          CURL_EXIT=$?

          if [ $CURL_EXIT -ne 0 ]; then
            echo "::warning::curl failed with exit code $CURL_EXIT — likely malformed URL."
            exit 0
          fi

          echo "Normattiva status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ]; then
            echo "::warning::Normattiva returned HTTP $STATUS"
          fi

  keep-repo-active:
    name: Keep repository active
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. When the last commit on the default branch is older than
    # 45 days, push an empty commit so this workflow is never auto-disabled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Push heartbeat commit if repository is idle
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Days since last commit: $DAYS"
          if [ "$DAYS" -lt 45 ]; then
            echo "Repository is active, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive heartbeat [skip ci]"
          git push
