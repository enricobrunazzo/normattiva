name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC
    - cron: '0 8 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-normpai:
    name: Ping NormPAI
    runs-on: ubuntu-latest
    env:
      # Progetto Supabase "NormPAI" (ref shluboroassdnvqjbapt).
      # La publishable key e' pubblica per design (protetta da RLS),
      # la stessa usata dal frontend.
      SUPABASE_URL: https://shluboroassdnvqjbapt.supabase.co
      SUPABASE_KEY: sb_publishable_Rzg2arXO7gI2sbf-ZwPVLg_A0Z6iH9n
    steps:
      - name: Query NormPAI database
        run: |
          # Interroga una tabella reale, cosi' la richiesta arriva al database
          # Postgres (non solo al gateway) e conta come attivita' del progetto.
          for i in 1 2 3; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "${SUPABASE_URL}/rest/v1/norme?select=norma_id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}") || STATUS="curl-error"
            echo "Tentativo $i - NormPAI status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          # Fallisce in modo visibile: GitHub invia una email di errore.
          echo "::error::Ping a NormPAI fallito (status $STATUS). Il progetto potrebbe essere in pausa."
          exit 1

  keep-repo-active:
    name: Keep repository active
    # GitHub disables scheduled workflows after 60 days without repository
    # activity. When the last commit on the default branch is older than
    # 45 days, push an empty commit so this workflow is never auto-disabled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Push heartbeat commit if repository is idle
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Days since last commit: $DAYS"
          if [ "$DAYS" -lt 45 ]; then
            echo "Repository is active, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive heartbeat [skip ci]"
          git push
